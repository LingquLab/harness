[project]
name = "cross-zone-development"
version = "0.3.0"
description = "HAPI blue/green AI bridge for Windows and CodeAgent compatible CLIs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cross-zone = "cross_zone.cli:main"

[tool.setuptools.packages.find]
include = ["cross_zone*"]
